name: Daily build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Build
        env:
          MAVEN_ARGS: -B
        run: |
          set -o pipefail
          make build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "Build failed with exit status $status"
            exit "$status"
          fi
          if grep -iE 'warning|error' build.log; then
            echo "Build failed due to warnings or errors in build.log"
            exit 1
          fi
